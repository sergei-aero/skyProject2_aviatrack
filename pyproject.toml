[project]
name = "skyproject2-aviatrack"
version = "0.1.0"
description = ""
authors = [
    {name = "sergei-aero",email = "pavlov.aero@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.flake8]
max-line-length = 119
extend-ignore = "E203, W503"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]
